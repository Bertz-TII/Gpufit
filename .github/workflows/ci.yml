name: Build

on:
  push:
    branches:
            - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `include` will only run specific combinations (not permutations of these)
        include:
          - os: windows-latest
            cuda: "12.9.0"
            visual_studio: "Visual Studio 2022"
            python: "3.12"
          # - os: ubuntu-20.04
          #   cuda: "11.4.0"
          #   python: "3.9"

    env:
      build_dir: "build"
      config: "Release"

    outputs:
      output_win: ${{ steps.artifact-upload-step-windows.outputs.artifact-id }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache build
        uses: actions/cache@v3
        with:
          path: ${{github.workspace}}/build
          key: ${{ matrix.os }}-build
          restore-keys: ${{ matrix.os }}-build

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"
          cache: "pip" # cache pip dependencies

      - name: Upgrade Pip and Install wheel
        run: |
          python -m pip install --upgrade pip
          pip install wheel

      - name: Install CUDA (Windows)
        uses: Jimver/cuda-toolkit@v0.2.24
        if: runner.os == 'Windows'
        with:
          sub-packages: '["nvcc", "visual_studio_integration", "cublas", "curand", "nvrtc", "cudart"]'
          cuda: ${{ matrix.cuda }}
          method: network
          use-github-cache: true

      - name: Install CUDA (Linux)
        uses: Jimver/cuda-toolkit@v0.2.27
        if: runner.os == 'Linux'
        with:
          sub-packages: '["nvcc", "nvrtc", "cudart"]'
          # cuda: ${{ matrix.cuda }}
          method: network
          use-github-cache: false

      - name: nvcc check
        shell: bash
        run: |
          nvcc -V
          ls "$CUDA_PATH"
          ls "$CUDA_PATH/bin"
          ls "$CUDA_PATH/include"
          ls "$CUDA_PATH/include/crt"

      - name: cmake version
        shell: bash
        run: cmake --version

      - name: Configure CMake
        id: configure
        shell: bash
        run: |
          if [ "${{ runner.os }}" -eq "Windows" ]
          then
            cmake . -B "${{ env.build_dir }}" -G "${{ matrix.visual_studio }}" -A x64
          else
            cmake . -B "${{ env.build_dir }}" -DCMAKE_BUILD_TYPE=RELEASE
          fi

      - name: Configure Error Processing
        if: ${{ (failure() && steps.configure.outcome == 'failure') || success() }}
        working-directory: ${{ env.build_dir }}
        shell: bash
        run: |
          if [[ -f "CMakeFiles/CMakeOutput.log" ]]; then
            echo "---- CMakeFiles/CMakeOutput.log"
            cat CMakeFiles/CMakeOutput.log
            echo "----"
          fi
          if [[ -f "CMakeFiles/CMakeError.log" ]]; then
            echo "---- CMakeFiles/CMakeError.log"
            cat CMakeFiles/CMakeError.log
            echo "----"
          fi

      - name: Build (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.build_dir }}
        run: cmake --build . --config ${{ env.config }} --target PYTHON_PACKAGE --verbose

      - name: Build (Linux)
        if: runner.os == 'Linux'
        working-directory: ${{ env.build_dir }}
        run: make

      - name: Upload Artifacts (Windows)
        uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: ${{ matrix.os }}-x64-cuda-${{ matrix.cuda }}
          path: build/Release/**/*
          overwrite: true

      - name: Upload Python Package (Windows)
        uses: actions/upload-artifact@v4
        id: artifact-upload-step-windows
        if: runner.os == 'Windows'
        with:
          name: pyGPUFit-${{ matrix.os }}-x64-cuda-${{ matrix.cuda }}-${{ matrix.python }}
          path: build/Release/pyGpufit/*
          overwrite: true
          

      - name: Upload Artifacts (Linux)
        uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        id: artifact-upload-step-linux
        with:
          name: ${{ matrix.os }}-x64-cuda-${{ matrix.cuda }}
          path: build/**/*
          overwrite: true
  
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{needs.build.outputs.output_win}}

      - name: List Files
        run: |
          ls
          zip -r pyGPUFit-win.zip .

      - name: Release Package
        uses: ncipollo/release-action@v1
        with:
          name: latest-win
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          tag: latest-win
          artifacts: |
              pyGPUFit-win.zip

          







        

